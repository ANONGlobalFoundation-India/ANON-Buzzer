<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANON Quiz — Buzzer</title>
<style>
  :root{
    --red:#EE3134; --red-dark:#C81E22; --red-light:#FF6F72;
    --blue:#365BA9; --blue-dark:#24407D;
    --gold:#FFC93C;
    --ink:#1B2430; --ink-soft:#5B6473;
    --bg:#F5F8FF; --card:#FFFFFF; --line:#E3E9F5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:var(--bg); color:var(--ink);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; min-height:100dvh;
    background-image:
      radial-gradient(circle at 8% 6%, rgba(238,49,52,0.07), transparent 32%),
      radial-gradient(circle at 92% 10%, rgba(54,91,169,0.08), transparent 34%),
      radial-gradient(circle at 90% 94%, rgba(238,49,52,0.06), transparent 30%),
      radial-gradient(circle at 4% 90%, rgba(54,91,169,0.06), transparent 30%);
    transition:background-color 0.4s ease;
  }
  body.win-flash{ background-color:#FFF6D8; }

  /* ---------- shared chrome ---------- */
  .wrap{ width:100%; max-width:480px; padding:1.6rem 1.4rem 3rem; display:flex; flex-direction:column; align-items:center; flex:1; }
  .brand{ display:flex; align-items:center; gap:0.6rem; margin-bottom:0.3rem; }
  .brand img{ height:34px; width:auto; display:block; }
  .brand span{ font-weight:800; font-size:1rem; color:var(--ink-soft); letter-spacing:0.01em; }
  h1{ font-size:1.7rem; font-weight:800; margin:0.4rem 0 1.6rem; text-align:center; color:var(--ink); }

  .conn-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#C4CBDA; margin-right:0.4rem; vertical-align:middle; }
  .conn-dot.live{ background:#2FBE6C; }
  .conn-row{ font-size:0.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:1.2rem; }

  /* ---------- name gate ---------- */
  .gate{ width:100%; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:1.8rem 1.5rem; box-shadow:0 12px 28px rgba(27,36,48,0.07); text-align:center; }
  .gate p{ color:var(--ink-soft); font-size:0.95rem; font-weight:500; margin:0 0 1.2rem; line-height:1.5; }
  input[type=text]{
    width:100%; font-size:1.05rem; font-weight:600; padding:0.85rem 1rem; border-radius:12px;
    border:2px solid var(--line); background:#FAFBFE; color:var(--ink); text-align:center; margin-bottom:1rem;
  }
  input[type=text]:focus{ outline:none; border-color:var(--blue); }
  .btn{
    font-size:1.05rem; font-weight:700; padding:0.9rem 1.6rem; border-radius:999px;
    border:none; cursor:pointer; color:#fff; width:100%; transition:transform 0.12s ease, opacity 0.12s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn.blue{ background:var(--blue); box-shadow:0 8px 18px rgba(54,91,169,0.3); }

  /* ---------- main stage ---------- */
  .stage{ width:100%; display:flex; flex-direction:column; align-items:center; flex:1; }
  .status-line{ font-size:1.05rem; font-weight:700; text-align:center; min-height:1.5em; margin-bottom:2rem; color:var(--ink-soft); }
  .status-line.armed{ color:var(--red-dark); }

  .buzzer-zone{ position:relative; width:min(260px, 62vw); aspect-ratio:1/1; margin-bottom:1.6rem; }
  .buzzer{
    width:100%; height:100%; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, var(--red-light), var(--red) 55%, var(--red-dark) 100%);
    box-shadow:0 14px 0 var(--red-dark), 0 18px 30px rgba(200,30,34,0.35);
    color:#fff; font-size:1.5rem; font-weight:800; letter-spacing:0.02em;
    transition:transform 0.08s ease, box-shadow 0.08s ease;
  }
  .buzzer:active:not(:disabled){ transform:translateY(10px); box-shadow:0 4px 0 var(--red-dark), 0 8px 16px rgba(200,30,34,0.3); }
  .buzzer:disabled{
    background:radial-gradient(circle at 35% 30%, #DDE2EE, #C4CBDA 55%, #A9B1C4 100%);
    box-shadow:0 14px 0 #8D97AC, 0 18px 30px rgba(27,36,48,0.12);
    cursor:not-allowed; color:#fff;
  }
  .buzzer.mine-locked{
    background:radial-gradient(circle at 35% 30%, var(--gold), #E6AE1F 55%, #B8860B 100%);
    box-shadow:0 14px 0 #8A6100, 0 18px 30px rgba(255,201,60,0.35);
  }

  .winner-card{
    width:100%; border-radius:18px; padding:1.4rem 1.2rem; text-align:center;
    background:var(--card); border:2px solid var(--gold); box-shadow:0 12px 26px rgba(27,36,48,0.08);
    margin-bottom:1.4rem; min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .winner-card .eyebrow{ font-size:0.85rem; font-weight:700; color:var(--ink-soft); margin-bottom:0.3rem; }
  .winner-card .name{ font-size:1.6rem; font-weight:800; color:var(--red-dark); }
  .winner-card.empty{ border-color:var(--line); }
  .winner-card.empty .eyebrow{ color:var(--ink-soft); }

  .next-btn{
    background:transparent; color:var(--blue); border:2px solid var(--blue); box-shadow:none;
    font-size:0.95rem; padding:0.75rem 1.4rem; margin-top:auto;
  }
  .next-btn:active:not(:disabled){ background:rgba(54,91,169,0.08); }

  .footnote{ font-size:0.78rem; color:var(--ink-soft); text-align:center; margin-top:1rem; line-height:1.5; }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>

  <h1>Quiz Buzzer</h1>
  <div class="conn-row"><span class="conn-dot" id="connDot"></span><span id="connText">Connecting…</span></div>

  <!-- Name entry gate -->
  <div class="gate" id="gate">
    <p>Enter your name to join the buzzer round. Everyone on this link is in the same live round.</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="24" autocomplete="off">
    <button class="btn blue" id="joinBtn">Join Quiz</button>
  </div>

  <!-- Main buzzer stage -->
  <div class="stage hidden" id="stage">
    <div class="status-line" id="statusLine">Waiting for the next question…</div>

    <div class="winner-card empty" id="winnerCard">
      <div class="eyebrow">No one has buzzed yet</div>
    </div>

    <div class="buzzer-zone">
      <button class="buzzer" id="buzzBtn" disabled>BUZZ</button>
    </div>

    <button class="btn next-btn" id="nextBtn">Next Question →</button>
    <div class="footnote">Tap "Next Question" once everyone's ready — it opens the buzzer for all.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
(function(){

  /* =========================================================
     1) PASTE YOUR FIREBASE CONFIG HERE
     Get this from: Firebase console → Project settings →
     "Your apps" → SDK setup and configuration.
  ========================================================= */
  var firebaseConfig = {
    apiKey: "AIzaSyCmupI864D1B5LlEwMd7ElSzIoniVWVEr0",
    authDomain: "anon-quiz-ff877.firebaseapp.com",
    databaseURL: "https://anon-quiz-ff877-default-rtdb.firebaseio.com",
    projectId: "anon-quiz-ff877",
    storageBucket: "anon-quiz-ff877.firebasestorage.app",
    messagingSenderId: "570274685413",
    appId: "1:570274685413:web:c586d8614e5b14ef964f0c"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var quizRef = db.ref('quiz');

  var myName = null;
  var myId = 'p_' + Math.random().toString(36).slice(2, 10);
  var haveBuzzedThisRound = false;

  var gate = document.getElementById('gate');
  var stage = document.getElementById('stage');
  var nameInput = document.getElementById('nameInput');
  var joinBtn = document.getElementById('joinBtn');
  var buzzBtn = document.getElementById('buzzBtn');
  var nextBtn = document.getElementById('nextBtn');
  var statusLine = document.getElementById('statusLine');
  var winnerCard = document.getElementById('winnerCard');
  var connDot = document.getElementById('connDot');
  var connText = document.getElementById('connText');

  /* ---------- connection indicator ---------- */
  db.ref('.info/connected').on('value', function(snap){
    if(snap.val() === true){
      connDot.classList.add('live');
      connText.textContent = 'Live';
    } else {
      connDot.classList.remove('live');
      connText.textContent = 'Connecting…';
    }
  });

  /* ---------- name gate ---------- */
  var savedName = localStorage.getItem('anonQuizName');
  if(savedName){ nameInput.value = savedName; }

  function join(){
    var v = nameInput.value.trim();
    if(!v) { nameInput.focus(); return; }
    myName = v;
    localStorage.setItem('anonQuizName', v);
    gate.classList.add('hidden');
    stage.classList.remove('hidden');
  }
  joinBtn.addEventListener('click', join);
  nameInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') join(); });

  /* ---------- simple buzz sound ---------- */
  function playTone(freq, dur){
    try{
      var ctx = playTone._ctx || (playTone._ctx = new (window.AudioContext || window.webkitAudioContext)());
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'square';
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + dur);
    }catch(e){}
  }

  /* ---------- render state from Firebase ---------- */
  function render(state){
    state = state || {};
    var status = state.status || 'idle';
    var winner = state.winner || null;

    if(status === 'open' && !winner){
      statusLine.textContent = '🟢 Buzzer is live — go!';
      statusLine.classList.add('armed');
      buzzBtn.disabled = haveBuzzedThisRound;
      buzzBtn.classList.remove('mine-locked');
      buzzBtn.textContent = 'BUZZ';
      winnerCard.className = 'winner-card empty';
      winnerCard.innerHTML = '<div class="eyebrow">No one has buzzed yet</div>';
    } else if(winner){
      statusLine.textContent = 'Buzzer locked for this question';
      statusLine.classList.remove('armed');
      buzzBtn.disabled = true;
      winnerCard.className = 'winner-card';
      winnerCard.innerHTML = '<div class="eyebrow">🔔 First to buzz</div><div class="name"></div>';
      winnerCard.querySelector('.name').textContent = winner.name;
      if(winner.id === myId){
        buzzBtn.classList.add('mine-locked');
        buzzBtn.textContent = 'YOU BUZZED FIRST!';
      } else {
        buzzBtn.classList.remove('mine-locked');
        buzzBtn.textContent = 'TOO LATE';
      }
    } else {
      statusLine.textContent = 'Waiting for the next question…';
      statusLine.classList.remove('armed');
      buzzBtn.disabled = true;
      buzzBtn.classList.remove('mine-locked');
      buzzBtn.textContent = 'BUZZ';
      winnerCard.className = 'winner-card empty';
      winnerCard.innerHTML = '<div class="eyebrow">No one has buzzed yet</div>';
    }
  }

  quizRef.on('value', function(snap){
    var state = snap.val();
    if(state && state.status !== 'open'){
      // round is locked or idle — reset local "already buzzed" flag once a fresh round opens
    }
    if(!state || state.status === 'idle' || (state.status === 'open' && !state.winner)){
      haveBuzzedThisRound = false;
    }
    render(state);
  });

  /* ---------- buzz press ---------- */
  buzzBtn.addEventListener('click', function(){
    if(haveBuzzedThisRound) return;
    haveBuzzedThisRound = true;
    navigator.vibrate && navigator.vibrate(40);

    quizRef.transaction(function(current){
      if(!current || current.status !== 'open' || current.winner) return; // abort, someone beat you or round not open
      current.status = 'locked';
      current.winner = { name: myName, id: myId, ts: Date.now() };
      return current;
    }, function(err, committed, snap){
      var val = snap ? snap.val() : null;
      if(committed && val && val.winner && val.winner.id === myId){
        playTone(880, 0.18);
      } else {
        playTone(220, 0.12);
      }
    });
  });

  /* ---------- next question / open buzzer ---------- */
  nextBtn.addEventListener('click', function(){
    quizRef.set({ status: 'open', winner: null });
    haveBuzzedThisRound = false;
  });

})();
</script>

</body>
</html>
